# Local dev database. Not used in deployed environments — those point
# DATABASE_URL at Supabase or Neon.
#
#   docker compose up -d
#
# Creates two databases: `ordersync` (dev) and `ordersync_test` (integration
# tests, so a test run never truncates dev data).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
      POSTGRES_DB: ordersync
    ports:
      # Host 5433 to stay clear of a stock Postgres already on 5432.
      - '5433:5432'
    volumes:
      - ordersync-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ordersync']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  ordersync-pgdata:
